<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artyify SignUp</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Quicksand:wght@300..700&family=Saira:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Sign Up CSS -->
    <link rel="stylesheet" href="assets/design/signup.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container-fluid px-4">

            <!-- Logo -->
            <a href="#" class="navbar-brand">
                <img src="assets/img/logo.png"
                     alt="Logo"
                     class="img-fluid logo">
            </a>

            <!-- Artist Log In -->
            <div class="nav-buttons">
                <a href="login.html" class="text-decoration-none">
                    <button type="button" class="btn login-btn">
                        Artist Log In
                    </button>
                </a>
            </div>

        </div>
    </nav>


    <!-- SIGN UP SECTION -->
     <form id="myForm">
    <main class="container login-container">

        <div class="row justify-content-center">
            <div class="col-12">

                <div class="login-box">
                    <h1>SIGN UP</h1>
                    <div class="input-box">
                        <input type="text"
                               name = "username"
                               id = "username"
                               class="form-control"
                               placeholder="Username">

                        <i class="fa-regular fa-circle-user user-icon"></i>
                    </div>

                    <div class="input-box">
                        <input type= "email"
                               name = "email"
                               id = "email"
                               class="form-control"
                               placeholder="Email">

                        <i class="fa-regular fa-envelope user-icon"></i>
                    </div>

                    <div class="input-box">
                        <input type="password"
                               name = "password"
                               id = "password"
                               class="form-control"
                               placeholder="Password">

                        <i class="fa-solid fa-unlock pass-icon"></i>
                    </div>

                    <div class="input-box">
                        <input type="password"
                               name = "confirm"
                               id = "confirm"
                               class="form-control"
                               placeholder="Confirm Password">

                        <i class="fa-solid fa-unlock pass-icon"></i>
                    </div>


                    <!-- SOCIAL ICONS -->
                    <div class="social-icons">

                        <a href="#" class="tt-icon">
                            <i class="fa-brands fa-tiktok"></i>
                        </a>

                        <a href="#" class="fb-icon">
                            <i class="fa-brands fa-facebook"></i>
                        </a>

                        <a href="#" class="yt-icon">
                            <i class="fa-brands fa-youtube"></i>
                        </a>

                    </div>


                    <!-- SIGN UP BUTTON -->
                <button type="submit" class="btn signup-btn signup-submit"> Sign Up</button>
</div>
</div>
</div>
</main>

</form>

    <script src="https://code.jquery.com/jquery-3.7.1.js"
    integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
    crossorigin="anonymous"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js"
    integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

   <script>
        $(document).ready(function(){

     $.validator.addMethod("lettersOnly", function (value, element) {
             return this.optional(element) || /^[A-Za-z]+$/.test(value);
                    });


            $("#myForm").validate({

                rules:{

                    username:{
                        required: true,
                        minlength: 5,
                        maxlength:10,
                        lettersOnly: true
                    },

                    email:{
                        required:true,
                        email: true,
                        minlength: 5
                    },

                    password:{
                        required: true,
                        minlength: 5,
                        maxlength:10
                    },

                    confirm: {
                        required:true,
                        equalTo: "#password"
                        
                    }

                },

                messages:{

                    username:{
                        required: "Create your username",
                        minlength: "It should be least 5 characters.",
                        maxlength: "It should not be more than 11 characters.",
                        lettersOnly: "It should be letters only"
                    },
                    email:{
                        required: "Enter your Email",
                        email: "Please enter your valid email",
                        minlength: "It should be least 5 characters."
                    },
                    password:{
                        required: "Create your own password",
                        minlength: "It should be least 5 characters.",
                        maxlength: "It should not be more than 11 characters.",
                    },
                    confirm: {
                        required:"Confirm your Password",
                        equalTo: "Password does not match"
                        
                    }

                },

    

            });

        });
    </script>
        

</body>
</html>
