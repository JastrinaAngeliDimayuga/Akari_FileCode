<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artyify Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Quicksand:wght@300..700&family=Saira:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Quicksand:wght@300..700&family=Saira:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    
    <!-- Login CSS -->
    <link rel="stylesheet" href="assets/design/login.css">

</head>


<body>

<nav class="navbar">
     <div class="container-fluid px-4">

    <!-- Logo -->
       <a href="#" class = "navbar-brand">
        <img src="assets/img/logo.png" alt="Logo" class="img-fluid logo">
       </a>
    
    <div class = "nav-buttons">

     <!-- Sign Up Buttons -->
         <a href="signup.html" class="text-decoration-none">
          <button type="button" class="btn signup-btn">Artist SignUp</button>
        </a>
    </div>
  </div>
</nav>

            <!-- Login Section -->

      <form id="myForm">
    <main class="container login-container">
        <div class="row justify-content-center">
             <div class="col-12">

                <div class="login-box">
                    <h1 class="mb-4">LOGIN</h1>
                <div class="mb-3 input-box">
                    <input type="text" class="form-control" name = "username" id = "username" placeholder="Username">
                    <i class="fa-regular fa-circle-user user-icon"></i>
                </div>
                <div class="mb-2 input-box">
                    <input type="password"  name = "password" id = "password" class="form-control" placeholder="Password">
                    <i class="fa-solid fa-unlock pass-icon"></i>
                </div>
                <div class="text-end mb-4">
                     <div id="login-error"></div>
                    <a href="#" class="forgot">Forgot Password?</a>
                </div>

                  <!-- Icon -->
                   <div class="social-icons">
                <a href="#" class="tt-icon"> <i class="fa-brands fa-tiktok"></i></a>
                <a href="#" class="fb-icon"> <i class="fa-brands fa-facebook"></i> </a>
                <a href="#" class="yt-icon"> <i class="fa-brands fa-youtube"></i> </a>
            </div>
              

                <!-- Login Button -->
            <button type = submit class="btn login-btn w-100">Log In</button> 
        </form>
    </div>
    </div>
    </div>
    </main>


<script src="https://code.jquery.com/jquery-3.7.1.js"
    integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
    crossorigin="anonymous"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js"
    integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function(){

            let attempt = 0;

            $("#myForm").validate({

                rules:{

                    username:{
                        required: true,
                        minlength: 5,
                        maxlength: 10
                    },
                    password:{
                        required: true,
                        minlength: 5,
                        maxlength: 10
                    }
                   
                },

                messages: {


                    username: {
                        required: "Please enter your username.",
                        minlength: "Username must be at least 5 characters.",
                        maxlength: "Username must not be more than 11 characters."
                    },

                    password:{
                         required: "Please enter your password.",
                         minlength: "Password must be at least 5 characters.",
                         maxlength: "Password must not be more than 11 characters."
                    }

                },


 submitHandler: function (form) {

    const correctUsername = "akarisaki";
    const correctPassword = "meowaki";

    const username = $("#username").val();
    const password = $("#password").val();

    $("#login-error").text("");

    if (username === correctUsername &&
         password === correctPassword) {
              window.location.href = "landing.html";
            } else {

             attempt++;

             if (attempt >= 3) {

            $("#login-error").text(
                 "Too many failed attempts. Login is locked.");
            $(".login-btn").prop("disabled", true);
            $("#username").prop("disabled", true);
            $("#password").prop("disabled", true);

             } else {

            $("#login-error").text("Incorrect username or password." );

                        }

                    }

                }

            });

        });

    </script>

</body>

</html>
